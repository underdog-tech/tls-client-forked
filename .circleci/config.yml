version: 2.1

parameters:
  service-name:
    type: string
    default: tls-client-forked

orbs:
  pinwheel-cicd: underdog-tech/pinwheel-cicd-orb@1.4
  macos: circleci/macos@2.4.0
  go: circleci/go@3.0.3

jobs:
  test:
    macos:
      xcode: 14.3.1
    working_directory: ~/<< pipeline.parameters.service-name >>
    steps:
      - checkout
      - go/with-cache:
          steps:
            - go/install:
                version: "1.24.1"
            - go/mod-download
            - go/test:
                covermode: atomic

workflows:
  test:
    jobs:
      - test:
          name: unit-test
          context: 'testing'
          filters:
            branches:
              ignore:
                - main
